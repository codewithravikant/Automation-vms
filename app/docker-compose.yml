# Local / single-host reference compose.
# Lab deploy uses scripts/app-deploy.sh across VMs instead.

services:
  backend:
    build:
      context: ./backend
    image: automation-alchemy-backend:latest
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: automation-alchemy-frontend:latest
    ports:
      - "8080:80"
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "3000"
      WEB_SERVER: local
    depends_on:
      - backend
    restart: unless-stopped
