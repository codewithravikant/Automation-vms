---
- name: Wait until apt/dpkg locks are free
  ansible.builtin.shell: |
    ! fuser /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock >/dev/null 2>&1
  register: apt_lock_free
  retries: 60
  delay: 5
  until: apt_lock_free.rc == 0
  changed_when: false

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300
  register: apt_docker
  retries: 20
  delay: 15
  until: apt_docker is succeeded

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Add devops to docker group
  ansible.builtin.user:
    name: "{{ devops_user }}"
    groups: docker
    append: true

- name: Configure Docker insecure registry for lab
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "insecure-registries": ["{{ registry }}"]
      }
  notify: Restart docker
