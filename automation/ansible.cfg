[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
# builtin default always exists. "yaml" is community.general and is missing on cicd,
# which aborts rollback with "Invalid callback for stdout specified: yaml".
stdout_callback = ansible.builtin.default
callback_result_format = yaml
interpreter_python = auto_silent
timeout = 30
forks = 6
# Belt-and-suspenders: do not fall back to the control-host login user
remote_user = devops
private_key_file = ../keys/id_ed25519

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False
become_user = root

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
