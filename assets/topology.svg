<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">Automation-VMs topology</title>
  <desc id="desc">Internet to loadbalancer to web1 and web2 to appserver</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="720" height="320" fill="url(#bg)"/>
  <text x="360" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#0f172a">Automation-VMs  Topology</text>

  <!-- Internet -->
  <rect x="40" y="120" width="120" height="56" rx="6" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <text x="100" y="145" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#0f172a">Internet</text>
  <text x="100" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">/ Host</text>

  <!-- loadbalancer -->
  <rect x="220" y="120" width="140" height="56" rx="6" fill="#fff" stroke="#0f766e" stroke-width="2"/>
  <text x="290" y="145" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#0f172a">loadbalancer</text>
  <text x="290" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">10.10.0.10</text>

  <!-- web1 -->
  <rect x="420" y="60" width="120" height="56" rx="6" fill="#fff" stroke="#0369a1" stroke-width="2"/>
  <text x="480" y="85" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#0f172a">web1</text>
  <text x="480" y="102" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">10.10.0.11</text>

  <!-- web2 -->
  <rect x="420" y="180" width="120" height="56" rx="6" fill="#fff" stroke="#0369a1" stroke-width="2"/>
  <text x="480" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#0f172a">web2</text>
  <text x="480" y="222" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">10.10.0.12</text>

  <!-- appserver -->
  <rect x="580" y="120" width="120" height="56" rx="6" fill="#fff" stroke="#b45309" stroke-width="2"/>
  <text x="640" y="145" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#0f172a">appserver</text>
  <text x="640" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">10.10.0.20</text>

  <!-- arrows -->
  <line x1="160" y1="148" x2="216" y2="148" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="140" x2="416" y2="95" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="156" x2="416" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="88" x2="576" y2="136" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="208" x2="576" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="360" y="290" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Private network 10.10.0.0/24 · NAT for internet on each VM</text>
</svg>
