# nginx load balancer — weighted round-robin (default)
# Installed by provisioning/loadbalancer.sh
# Switch: make lb-algorithm ALG=weighted|least_conn|resource

# gzip on is already set in /etc/nginx/nginx.conf — only tune types/level here
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

upstream app_backend {
    server 10.10.0.20:3000;
    keepalive 16;
}

upstream web_backends {
    server 10.10.0.11:80 weight=3;
    server 10.10.0.12:80 weight=1;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /lb-status {
        default_type application/json;
        add_header Cache-Control "no-store";
        alias /var/lib/automation-alchemy/lb-status.json;
    }

    # API terminates at LB → appserver (skip web hop)
    location /api/ {
        proxy_pass http://app_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://web_backends;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
