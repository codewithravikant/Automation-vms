<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Automation-VMs — Load Balancer</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0f1419;
        --fg: #e7ecf1;
        --muted: #9aa7b5;
        --accent: #3d9cf0;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f4f7fa;
          --fg: #14202b;
          --muted: #5b6b7a;
          --accent: #1a6fb5;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(ellipse at top, #1a2a3a 0%, var(--bg) 55%);
        color: var(--fg);
      }
      main {
        max-width: 36rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: clamp(1.75rem, 4vw, 2.25rem);
        margin: 0 0 0.5rem;
        letter-spacing: -0.02em;
      }
      p { color: var(--muted); line-height: 1.5; margin: 0.5rem 0; }
      .badge {
        display: inline-block;
        margin-top: 1.25rem;
        padding: 0.35rem 0.75rem;
        border: 1px solid var(--accent);
        color: var(--accent);
        border-radius: 999px;
        font-size: 0.85rem;
        font-family: ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Load Balancer</h1>
      <p>Automation-VMs — public HTTP entry point.</p>
      <p>Only this VM should be reachable from outside on port 80.</p>
      <div class="badge">10.10.0.10 · nginx</div>
    </main>
  </body>
</html>
